name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
concurrency:
  group: board-aventure-android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      # Restore the same debug certificate on every CI build.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: board-aventure-debug-signing-v2
      - name: Ensure debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          CERT_INFO="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey)"
          echo "$CERT_INFO" | grep "SHA256:"
          EXPECTED_CERT="0D:1F:83:3E:9D:11:8D:38:C0:1E:65:95:9F:E3:01:C5:6C:27:2A:C3:7F:C6:E5:71:AA:C7:94:6E:C3:7C:1A:2D"
          echo "$CERT_INFO" | grep -F "$EXPECTED_CERT" >/dev/null || { echo "::error::Unexpected signing certificate; refusing to publish an incompatible APK."; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep "SHA256:"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run regression tests
        working-directory: BoardAventureIA
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: BoardAventureIA
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK signature and package
        run: |
          APK="BoardAventureIA/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | head -n 1
          echo "$BADGING" | grep -F "package: name='fr.boardaventure.ia'" >/dev/null || { echo "::error::Unexpected APK applicationId."; exit 1; }
          sha256sum "$APK"
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Board-Aventure-IA-debug-apk
          path: BoardAventureIA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
